<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Sfondo con gradiente scuro -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181e29"/>
      <stop offset="100%" stop-color="#0f131a"/>
    </linearGradient>

    <!-- Gradiente Cyan per le connessioni neurali -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Gradiente Verde per il segno di spunta -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>

    <!-- Effetto Bagliore Neon -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Ombra morbida -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Sfondo Squircle (Angoli Arrotondati stile iOS) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGlow)"/>

  <!-- Bagliore di sfondo della rete neurale -->
  <path d="M 180 140 C 140 140 110 170 110 210 C 90 220 80 250 85 280 C 80 310 95 340 120 355 C 130 380 160 400 190 390 C 210 400 235 400 250 385 C 270 400 300 395 320 380 C 350 380 380 355 380 320 C 400 300 400 260 385 230 C 400 195 375 160 340 155 C 320 130 280 125 250 140 C 220 125 195 130 180 140 Z" 
        fill="none" stroke="#0284c7" stroke-width="18" opacity="0.25" filter="url(#glow)"/>

  <!-- Struttura Cervello AI -->
  <g stroke="url(#cyanGrad)" stroke-linecap="round" stroke-linejoin="round" filter="url(#softShadow)">
    <!-- Connessioni sinaptiche -->
    <g stroke-width="6" opacity="0.85">
      <line x1="180" y1="180" x2="230" y2="160" />
      <line x1="230" y1="160" x2="280" y2="170" />
      <line x1="280" y1="170" x2="330" y2="190" />
      <line x1="180" y1="180" x2="150" y2="220" />
      <line x1="150" y1="220" x2="190" y2="250" />
      <line x1="190" y1="250" x2="230" y2="160" />
      <line x1="230" y1="160" x2="270" y2="230" />
      <line x1="280" y1="170" x2="340" y2="240" />
      <line x1="150" y1="220" x2="130" y2="280" />
      <line x1="130" y1="280" x2="170" y2="310" />
      <line x1="170" y1="310" x2="190" y2="250" />
      <line x1="340" y1="240" x2="370" y2="290" />
      <line x1="370" y1="290" x2="330" y2="340" />
      <line x1="330" y1="340" x2="280" y2="350" />
      <line x1="270" y1="230" x2="330" y2="340" />
      <line x1="170" y1="310" x2="220" y2="360" />
    </g>

    <!-- Archi di contorno -->
    <path d="M 170 150 C 130 150 110 180 110 215 C 95 230 90 260 100 285 C 90 315 105 345 130 355 C 145 375 170 385 195 380" fill="none" stroke-width="12" />
    <path d="M 340 160 C 370 180 385 210 375 245 C 390 270 385 305 365 325 C 350 350 325 365 295 365" fill="none" stroke-width="12" />
    <path d="M 210 135 C 250 125 290 135 320 155" fill="none" stroke-width="12" />

    <!-- Nodi della rete (Punti) -->
    <g fill="#e0f2fe" stroke="none">
      <circle cx="180" cy="180" r="9" />
      <circle cx="230" cy="160" r="10" />
      <circle cx="280" cy="170" r="9" />
      <circle cx="330" cy="190" r="8" />
      <circle cx="150" cy="220" r="9" />
      <circle cx="190" cy="250" r="10" />
      <circle cx="270" cy="230" r="9" />
      <circle cx="340" cy="240" r="10" />
      <circle cx="130" cy="280" r="8" />
      <circle cx="170" cy="310" r="9" />
      <circle cx="370" cy="290" r="9" />
      <circle cx="330" cy="340" r="10" />
      <circle cx="220" cy="360" r="8" />
      <circle cx="280" cy="350" r="8" />
    </g>
  </g>

  <!-- Segno di Spunta (Checkmark) -->
  <g filter="url(#softShadow)">
    <path d="M 210 280 L 265 335 L 375 205" 
          fill="none" 
          stroke="url(#greenGrad)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
